<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in with Google · Campus Shield</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Roboto', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #f8fafc;
      color: #1f2937;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .google-card {
      background: #ffffff;
      border: 1px solid #dadce0;
      border-radius: 12px;
      padding: 36px 32px;
      max-width: 440px;
      width: 100%;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.06);
    }
    .google-header {
      text-align: center;
      margin-bottom: 24px;
    }
    .google-logo {
      width: 44px;
      height: 44px;
      margin-bottom: 14px;
    }
    .google-header h1 {
      font-size: 1.45rem;
      font-weight: 500;
      color: #202124;
      margin-bottom: 6px;
    }
    .google-header p {
      font-size: 0.95rem;
      color: #5f6368;
    }
    .app-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #f1f3f4;
      padding: 4px 12px;
      border-radius: 16px;
      font-size: 0.85rem;
      font-weight: 500;
      color: #3c4043;
      margin-top: 8px;
    }
    .account-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 20px;
    }
    .account-item {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 12px 14px;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }
    .account-item:hover {
      background: #f8f9fa;
      border-color: #1a73e8;
    }
    .account-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: #1a73e8;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      font-weight: 500;
    }
    .account-info {
      flex: 1;
      text-align: left;
    }
    .account-name {
      font-weight: 500;
      font-size: 0.92rem;
      color: #202124;
    }
    .account-email {
      font-size: 0.82rem;
      color: #5f6368;
    }
    .divider {
      text-align: center;
      margin: 16px 0;
      position: relative;
    }
    .divider::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 0;
      right: 0;
      border-top: 1px solid #dadce0;
    }
    .divider span {
      background: white;
      padding: 0 10px;
      position: relative;
      font-size: 0.8rem;
      color: #70757a;
    }
    .custom-email-form {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .input-field {
      width: 100%;
      padding: 13px 14px;
      border: 1px solid #dadce0;
      border-radius: 6px;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }
    .input-field:focus {
      border-color: #1a73e8;
      box-shadow: 0 0 0 1px #1a73e8;
    }
    .btn-submit {
      background: #1a73e8;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 6px;
      font-weight: 500;
      font-size: 0.95rem;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-submit:hover {
      background: #1557b0;
    }
    .consent-text {
      margin-top: 20px;
      font-size: 0.78rem;
      color: #5f6368;
      line-height: 1.5;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="google-card">
    <div class="google-header">
      <svg class="google-logo" viewBox="0 0 24 24">
        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
      </svg>
      <h1>Sign in with Google</h1>
      <p>Choose an account to continue</p>
      <div class="app-badge">🛡️ Campus Shield</div>
    </div>

    <!-- Quick Accounts -->
    <div class="account-list">
      <div class="account-item" onclick="chooseAccount('Student Account', 'student@gmail.com')">
        <div class="account-avatar" style="background:#ea4335;">S</div>
        <div class="account-info">
          <div class="account-name">Student Account</div>
          <div class="account-email">student@gmail.com</div>
        </div>
      </div>
      <div class="account-item" onclick="chooseAccount('Campus Member', 'campus.member@gmail.com')">
        <div class="account-avatar" style="background:#34a853;">C</div>
        <div class="account-info">
          <div class="account-name">Campus Member</div>
          <div class="account-email">campus.member@gmail.com</div>
        </div>
      </div>
    </div>

    <div class="divider">
      <span>or use your personal Gmail</span>
    </div>

    <!-- Custom Gmail Input -->
    <form class="custom-email-form" onsubmit="handleCustomEmail(event)">
      <input type="email" id="customEmail" class="input-field" placeholder="Enter your Google Email" required />
      <input type="text" id="customName" class="input-field" placeholder="Your Full Name (optional)" />
      <button type="submit" class="btn-submit">Continue with this Account</button>
    </form>

    <div class="consent-text">
      To continue, Google will share your name, email address, and profile picture with <strong>Campus Shield</strong>.
    </div>
  </div>

  <script>
    function chooseAccount(name, email) {
      sendToParent(name, email);
    }

    function handleCustomEmail(e) {
      e.preventDefault();
      const email = document.getElementById('customEmail').value.trim();
      let name = document.getElementById('customName').value.trim();
      if (!name) {
        name = email.split('@')[0].replace(/[._-]/g, ' ').replace(/\b\w/g, function (l) { return l.toUpperCase(); });
      }
      sendToParent(name, email);
    }

    function sendToParent(name, email) {
      const payload = {
        type: 'GOOGLE_AUTH_SUCCESS',
        name: name,
        email: email,
        googleId: 'google_' + Date.now(),
      };

      if (window.opener) {
        window.opener.postMessage(payload, '*');
        window.close();
      } else {
        localStorage.setItem('campus_google_auth', JSON.stringify(payload));
        window.close();
      }
    }
  </script>
</body>
</html>
